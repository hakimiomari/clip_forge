name: clipforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipforge-postgres
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clipforge-redis
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO publishes current images on quay.io, not Docker Hub
    image: quay.io/minio/minio:latest
    container_name: clipforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipforge
      MINIO_ROOT_PASSWORD: clipforge-secret
      # Allow the browser to PUT/GET presigned URLs from the web app
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: create the bucket on first boot
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 clipforge clipforge-secret &&
      mc mb --ignore-existing local/clipforge &&
      echo 'Bucket ready.'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
